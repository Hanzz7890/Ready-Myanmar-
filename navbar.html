<div class="modal fade" id="loginModal" tabindex="-1" aria-labelledby="loginTitle" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable">
        <div class="modal-content">
            <div class="modal-header">
                <h2 class="modal-title fs-5" id="loginTitle">Log in</h2>
                <button class="btn-close" type="button" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <form class="modal-body" data-auth="login" novalidate>
                <label class="form-label" for="loginEmail">Email</label>
                <input class="form-control mb-3" id="loginEmail" name="email" type="email"
                    autocomplete="email" maxlength="254" required>

                <label class="form-label" for="loginPassword">Password</label>
                <input class="form-control mb-3" id="loginPassword" name="password"
                    type="password" autocomplete="current-password" maxlength="128" required>

                <button class="btn btn-success" type="submit">Log in</button>
            </form>
        </div>
    </div>
</div>

<div class="modal fade" id="signupModal" tabindex="-1" aria-labelledby="signupTitle" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable">
        <div class="modal-content">
            <div class="modal-header">
                <h2 class="modal-title fs-5" id="signupTitle">Create an account</h2>
                <button class="btn-close" type="button" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <form class="modal-body" data-auth="signup" novalidate>
                <p class="small text-body-secondary">This demo account stays in this browser. Use a test password.</p>

                <label class="form-label" for="signupName">Name</label>
                <input class="form-control mb-3" id="signupName" name="displayName" type="text"
                    autocomplete="name" maxlength="50" required>

                <label class="form-label" for="signupEmail">Email</label>
                <input class="form-control mb-3" id="signupEmail" name="email" type="email"
                    autocomplete="email" maxlength="254" required>

                <label class="form-label" for="signupPassword">Password (at least 8 characters)</label>
                <input class="form-control mb-3" id="signupPassword" name="password" type="password"
                    autocomplete="new-password" minlength="8" maxlength="128" required>

                <label class="form-label" for="signupConfirm">Confirm password</label>
                <input class="form-control mb-3" id="signupConfirm" name="confirmation" type="password"
                    autocomplete="new-password" maxlength="128" required>

                <button class="btn btn-success" type="submit">Create account</button>
            </form>
        </div>
    </div>
</div>
